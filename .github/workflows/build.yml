name: Build

# Every push: check that the app builds. The APK is kept as a build artifact
# (Actions tab → run → Artifacts) but no release is created.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Caches Gradle; the version comes from the project's wrapper (gradlew).
      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk JaWa-debug-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: JaWa-debug-apk
          path: JaWa-debug-*.apk
          retention-days: 14
