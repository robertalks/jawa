name: Release

# Runs only when you push a version tag:
#   git tag v0.9 && git push origin v0.9
# Builds a release APK (no AAB bundle) signed with your key from the repo's secrets
# (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) and publishes it
# as a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Caches Gradle; the version comes from the project's wrapper (gradlew).
      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check tag matches versionName
        run: |
          app_version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "$app_version" != "${{ steps.ver.outputs.version }}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} but versionName in app/build.gradle.kts is $app_version"
            exit 1
          fi

      # Your signing key comes from the repo's secrets (Settings → Secrets and
      # variables → Actions). It's written to a temp file only for this run.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret $v"; exit 1; fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jawa-release.keystore"
          echo "JAWA_KEYSTORE_FILE=$RUNNER_TEMP/jawa-release.keystore" >> "$GITHUB_ENV"

      # assembleRelease builds only the APK; an AAB would need bundleRelease.
      - name: Build signed release APK
        env:
          JAWA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          JAWA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          JAWA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify signature
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/jawa-release.keystore"

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk JaWa-${{ steps.ver.outputs.version }}.apk

      - uses: softprops/action-gh-release@v2
        with:
          name: JaWa ${{ steps.ver.outputs.version }}
          files: JaWa-${{ steps.ver.outputs.version }}.apk
          generate_release_notes: true
